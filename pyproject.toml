[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "tractusx_sdk"
version = "0.8.4-rc1"
description = "Eclipse Tractus-X Software Development KIT - The Dataspace & Industry Foundation Middleware"
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "annotated-types (>=0.7.0,<0.8.0)",
    "deprecation (>=2.1.0,<3.0.0)",
    "email-validator (>=2.2.0,<3.0.0)",
    "exceptiongroup (>=1.2.0,<2.0.0)",
    "fastapi (>=0.143.2,<0.144.0)",
    "fastapi-keycloak-middleware (>=1.1.0,<2.0.0)",
    "fastapi_cache2 (>=0.2.2,<0.3.0)",
    "filelock (>=4.2.1,<5.0.0)",
    "httpx (>=0.26.0,<0.29.0)",
    "jinja2 (>=3.1.4,<4.0.0)",
    "jsonschema (>=4.0.0,<5.0.0)",
    "pydantic (>=2.6.3,<3.0.0)",
    "pydantic-core (>=2.16.3,<3.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "python-keycloak (>=4.0.1,<5.0.0)",
    "python-multipart (>=0.0.31,<0.1.0)",
    "pyyaml (>=6.0.0,<7.0.0)",
    "requests (>=2.33.0,<3.0.0)",
    "requests-toolbelt (>=1.0.0,<2.0.0)",
    "sqlalchemy (>=2.0.38,<3.0.0)",
    "sqlmodel (>=0.0.22,<0.1.0)",
    "tomli (>=2.0.1,<3.0.0)",
    "typer (>=0.15.0,<0.16.0)",
    "uvicorn (>=0.30.0,<0.36.1)",
    "uvloop (>=0.21.0,<0.22.2); sys_platform == 'linux' or sys_platform == 'darwin'",
    "winloop (>=0.1.8,<0.2.0); sys_platform == 'win32'",
]

[project.optional-dependencies]
s3 = ["boto3>=1.43.0,<2.0.0"]

[project.urls]
"Homepage" = "https://eclipse-tractusx.github.io/tractusx-sdk/main/"
"Repository" = "https://github.com/eclipse-tractusx/tractusx-sdk"
"Documentation" = "https://eclipse-tractusx.github.io/tractusx-sdk/main/"
"Issues" = "https://github.com/eclipse-tractusx/tractusx-sdk/issues"
"Changelog" = "https://github.com/eclipse-tractusx/tractusx-sdk/blob/main/CHANGELOG.md"

[tool.poetry]
requires-poetry = ">=2.0"

[tool.poetry.group.dev.dependencies]
fastapi-cli = "^0.0.7"
build = "^1.2.2"
setuptools = "^84.1.0"

[tool.poetry.group.test.dependencies]
pytest = "^9.0.3"
pytest-cov = "^6.0.0"
pytest-asyncio = "^0.15.1"
requests-mock = "^1.12.1"
moto = "^5.0.0"

[tool.poetry.group.quality.dependencies]
mypy = "^2.4.1"
types-requests = "^2.32.0"
types-pyyaml = "^6.0.12"
types-jsonschema = "^4.23.0"


[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.7.7"
mkdocs-material-extensions = "^1.3.1"
pymdown-extensions = "^11.0.1"
mkdocstrings = {extras = ["python"], version = "^0.30.1"}
mike = "^2.1.3"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
check_untyped_defs = true
show_error_codes = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Third-party packages without type stubs or a py.typed marker
module = ["boto3.*", "botocore.*", "keycloak.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Legacy baseline: modules with known type errors, silenced so CI only catches regressions.
# Entries must only ever be removed (fix the module, then delete it here); never add new ones.
module = [
    "tractusx_sdk.dataspace.adapters.adapter",
    "tractusx_sdk.dataspace.adapters.connector.adapter_factory",
    "tractusx_sdk.dataspace.adapters.connector.base_dma_adapter",
    "tractusx_sdk.dataspace.controllers.connector.base_dma_controller",
    "tractusx_sdk.dataspace.controllers.connector.jupiter.dma_controller",
    "tractusx_sdk.dataspace.controllers.connector.saturn.dma_controller",
    "tractusx_sdk.dataspace.controllers.connector.utils.mixins.base_mixins",
    "tractusx_sdk.dataspace.managers.connection.database.postgres_connection_manager",
    "tractusx_sdk.dataspace.managers.connection.database.postgres_memory_connection_manager",
    "tractusx_sdk.dataspace.managers.connection.database.postgres_memory_refresh_connection_manager",
    "tractusx_sdk.dataspace.managers.connection.memory.memory_connection_manager",
    "tractusx_sdk.dataspace.managers.oauth2_manager",
    "tractusx_sdk.dataspace.models.connector.model_factory",
    "tractusx_sdk.dataspace.services.connector.base_connector_consumer",
    "tractusx_sdk.dataspace.services.connector.base_connector_provider",
    "tractusx_sdk.dataspace.services.connector.base_connector_service",
    "tractusx_sdk.dataspace.services.connector.jupiter.connector_consumer_service",
    "tractusx_sdk.dataspace.services.connector.saturn.connector_consumer_service",
    "tractusx_sdk.dataspace.services.connector.service_factory",
    "tractusx_sdk.dataspace.services.discovery.base_discovery_service",
    "tractusx_sdk.dataspace.services.discovery.connector_discovery_service",
    "tractusx_sdk.dataspace.services.service",
    "tractusx_sdk.dataspace.tools.cache",
    "tractusx_sdk.dataspace.tools.dsp_tools",
    "tractusx_sdk.dataspace.tools.http_tools",
    "tractusx_sdk.dataspace.tools.operators",
    "tractusx_sdk.dataspace.tools.tracing",
    "tractusx_sdk.dataspace.tools.validate_submodels",
    "tractusx_sdk.extensions.geometry.geometry_aspect_validator.validateGeometry",
    "tractusx_sdk.extensions.notification_api.services.notification_consumer_service",
    "tractusx_sdk.extensions.notification_api.services.notification_service",
    "tractusx_sdk.extensions.semantics.schema_to_context_translator",
    "tractusx_sdk.extensions.tck.connector.runners",
    "tractusx_sdk.industry.adapters.submodel_adapters.file_system_adapter",
    "tractusx_sdk.industry.adapters.submodel_adapters.http_submodel_adapter",
    "tractusx_sdk.industry.adapters.submodel_adapters.s3_adapter",
    "tractusx_sdk.industry.models.aas.v3.base",
    "tractusx_sdk.industry.services.aas_service",
    "tractusx_sdk.industry.services.discovery.bpn_discovery_service",
    "tractusx_sdk.industry.services.notifications.notification_consumer_service",
    "tractusx_sdk.industry.services.notifications.notification_service",
]
ignore_errors = true
